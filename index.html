</style><main><small>SPEAK QUEST / 7.0</small><h1>La tua voce, le tue scelte.</h1><section id="header"></section><nav id="nav"></nav><div id="view"></div><p class="muted">Allenamento complementare alla logopedia. Nessuna promessa di guarigione. I punti premiano la partecipazione, non la fluidità.</p></main><script>

const calls=[['Pizzeria','Fate pizze da asporto?','Fino a che ora posso ordinare?'],['Palestra','Quanto costa un abbonamento mensile?','Ci sono costi di iscrizione?'],['Abbigliamento','A che ora chiudete oggi?','Siete aperti domenica?'],['Autolavaggio','Quanto costa un lavaggio completo?','Serve prenotare?'],['Elettronica','Avete auricolari wireless?','Quanto costa il modello?'],['Barbiere','Quanto costa un taglio?','Serve appuntamento?'],['Ristorante','Posso avere informazioni sul menù?','Quali sono i prezzi?'],['Hotel','Vorrei informazioni sulle camere.','Quali servizi sono inclusi?'],['Officina','Quanto costa un tagliando?','Spiega il modello della tua auto.'],['Fornitore termoidraulico','Buongiorno, sono [nome e cognome]. Vorrei informazioni su un prodotto.','Chiedi disponibilità e prezzo.'],['Centro sportivo','Vorrei informazioni sui corsi.','Chiedi orari e costi.'],['Attività a scelta','Presentati senza leggere.','Fai due domande autentiche.']];
let state={days:[],calls:[],bonus:[]};try{state=JSON.parse(localStorage.getItem('speakquest5'))||state}catch(e){}let tab='Dashboard',step=0,opened=false,recognition=null,clock=null;const $=id=>document.getElementById(id);function save(){try{localStorage.setItem('speakquest5',JSON.stringify(state))}catch(e){alert('Salvataggio locale non disponibile. Usa Esporta.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function range(id,label){return `<label>${label}: <output id="${id}o">5</output>/10<input id="${id}" type="range" min="0" max="10" value="5" oninput="document.getElementById('${id}o').value=this.value"></label>`}function val(id){return Number($(id).value)}function switchTab(t){if(activeVoice){alert("Termina prima la registrazione.");return}releaseAudio();stop();tab=t;render()}function stop(){if(clock)clearInterval(clock);clock=null;if(recognition){try{recognition.stop()}catch(e){}recognition=null}}function render(){let d=state.days.length,c=state.calls.length,xp=d*100+state.calls.reduce((a,b)=>a+b.xp,0)+state.bonus.length*50;$('header').innerHTML=`<div class="score">${xp} XP · Livello ${Math.min(6,1+Math.floor(d/5))}</div><p>${d}/30 giorni · ${c}/12 chiamate</p><progress max="30" value="${d}"></progress>`;$('nav').innerHTML=['Dashboard','Allenamento','Voce','Chiamate','Statistiche'].map(t=>`<button class="${tab===t?'':'secondary'}" onclick="switchTab('${t}')">${t}</button>`).join('');let v=$('view');if(tab==='Dashboard'){v.innerHTML=dashboard();}else if(tab==='Allenamento'){if(d>=30){v.innerHTML='<section><h2>Percorso completato!</h2>Continua a praticare senza pressione.</section>';return}let phases=['Riscaldamento','Tecnica vocale','Missione','Discorso libero','Autovalutazione'],instructions=['Rilassa spalle e mandibola. Respira naturalmente.','Pronuncia: Oggi sono al lavoro. Il prezzo è undici euro. Vorrei presentarmi. Inizia senza spingere la voce.',tasks[d],'Parla liberamente di lavoro, sport, viaggi o futuro. Non ricominciare per ogni esitazione.'];v.innerHTML=`<section><small>GIORNO ${d+1} · ${levels[Math.floor(d/5)]}</small><h2>${phases[step]} (${step+1}/5)</h2>${step<4?`<p>${instructions[step]}</p><p id="timer" aria-live="off">${[3,4,5,3][step]}:00</p><button onclick="timer(${[3,4,5,3][step]}*60)">Avvia timer</button><button class="secondary" onclick="stop()">Ferma timer</button><button onclick="stop();step++;render()">Continua</button>`:range('eff','Sforzo')+range('fear','Paura')+'<label><input type="checkbox" id="goal"> Ho comunicato ciò che volevo</label><button onclick="finishDay()">Completa +100 XP</button>'}</section><section><h2>Bonus +50 XP</h2>${state.bonus.includes(d)?'Bonus completato':opened?`<p>${['Presentati con nome e cognome.','Pronuncia tre prezzi in frasi.','Spiega un prodotto in un minuto.','Racconta un progetto futuro.'][d%4]}</p><button onclick="state.bonus.push(${d});save();render()">Sfida affrontata</button>`:'<button onclick="opened=true;render()">Apri bonus misterioso</button>'}</section>`}else if(tab==='Voce'){v.innerHTML=voiceView();}else if(tab==='Chiamate'){if(c>=calls.length){v.innerHTML='<section><h2>Campagna completata!</h2></section>';return}let m=calls[c];v.innerHTML=`<section><small>CHIAMATA ${c+1}/12 · Difficoltà ${1+Math.floor(c/3)}/4</small><h2>${m[0]}</h2><p>Chiama solo durante gli orari di apertura e se hai una domanda autentica.</p><p>Buongiorno, ${m[1]}</p><p>${m[2]}</p><p>Grazie mille, buona giornata!</p><a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(m[0])}">Trova attività</a>${range('before','Ansia prima')}<button onclick="prepareCall()">Ho fatto la chiamata</button><div id="callreview"></div></section>`}else{v.innerHTML=`<section><h2>Statistiche</h2><p>Giorni: ${d}/30 · Telefonate: ${c}/12</p><p>${d?'Sforzo medio: '+(state.days.reduce((a,b)=>a+b.eff,0)/d).toFixed(1)+'/10':'Nessun giorno registrato'}</p><p>${c?'Ansia media prima: '+(state.calls.reduce((a,b)=>a+b.before,0)/c).toFixed(1)+' · dopo: '+(state.calls.reduce((a,b)=>a+b.after,0)/c).toFixed(1):''}</p><ol>${state.days.map((r,i)=>`<li>Giorno ${i+1}: sforzo ${r.eff}/10, paura ${r.fear}/10</li>`).join('')}</ol><button onclick="exportData()">Esporta progressi</button><label>Importa backup<input type="file" accept="application/json" onchange="importData(this)"></label></section>`}}
function timer(n){if(clock)clearInterval(clock);let end=Date.now()+n*1000;function tick(){let t=Math.max(0,Math.ceil((end-Date.now())/1000));if(!$('timer'))return stop();$('timer').textContent=Math.floor(t/60)+':'+String(t%60).padStart(2,'0');if(!t){clearInterval(clock);clock=null;$('timer').textContent='Tempo completato'}}tick();clock=setInterval(tick,250)}function finishDay(){state.days.push({eff:val('eff'),fear:val('fear'),goal:$('goal').checked,date:localDay()});step=0;opened=false;save();render()}function prepareCall(){if($('callreview').innerHTML)return;$('before').disabled=true;$('callreview').innerHTML=range('after','Ansia dopo')+range('effort','Sforzo')+'<label><input type="checkbox" id="said"> Ho comunicato ciò che volevo</label><button onclick="finishCall()">Registra telefonata</button>'}function finishCall(){state.calls.push({before:val('before'),after:val('after'),effort:val('effort'),xp:150+($('said').checked?50:0),date:localDay(),goal:$('said').checked});save();render()}
function listen(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R){$('status').textContent='Riconoscimento non supportato: usa Chrome o Safari compatibile, oppure inserisci il testo.';return}stop();let r=new R();recognition=r;r.lang='it-IT';r.continuous=true;r.interimResults=true;r.onstart=()=>{if($('status'))$('status').textContent='Microfono attivo'};r.onresult=e=>{if($('transcript'))$('transcript').value=Array.from(e.results).map(x=>x[0].transcript).join(' ')};r.onerror=e=>{if($('status'))$('status').textContent='Microfono: '+e.error};r.onend=()=>{if($('status'))$('status').textContent='Ascolto terminato'};try{r.start()}catch(e){$('status').textContent='Impossibile avviare il microfono'}}function feedback(){let text=$('transcript').value.trim(),words=text?text.split(/\s+/):[],t=val('tension');let repeats=words.filter((w,i)=>i&&w.toLowerCase()===words[i-1].toLowerCase()).length;$('feedback').innerHTML=`<h3>Feedback orientativo</h3><p>Parole trascritte: ${words.length}. Ripetizioni consecutive nel testo: ${repeats}.</p><p>${t>=7?'Riduci la difficoltà, concediti una pausa e riprova con frasi brevi.':'Mantieni un ritmo naturale e concentrati sul messaggio.'}</p><p>${repeats?'Sono presenti ripetizioni nella trascrizione: non sono necessariamente balbuzie.':'La trascrizione non permette di escludere blocchi.'}</p><p>Prossimo esercizio: ripeti il concetto senza forzare la voce, accettando eventuali esitazioni.</p><small>Non misura clinicamente ritmo, blocchi o tensione. Il servizio di riconoscimento del browser può elaborare l’audio online.</small>`}function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(state)],{type:'application/json'}));a.download='speakquest-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function importData(el){try{let x=JSON.parse(await el.files[0].text());if(!Array.isArray(x.days)||!Array.isArray(x.calls)||!Array.isArray(x.bonus)||x.days.length>30||x.calls.length>12||!x.days.every(r=>Number.isFinite(r.eff)&&Number.isFinite(r.fear))||!x.calls.every(r=>Number.isFinite(r.before)&&Number.isFinite(r.after)&&Number.isFinite(r.xp)))throw Error();state=x;state.voice=Array.isArray(x.voice)?x.voice.filter(validVoice):[];step=0;save();render()}catch(e){alert('Backup non valido')}}
function localDay(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function avg(a,k){return a.length?(a.reduce((n,r)=>n+Number(r[k]),0)/a.length).toFixed(1):'—'}
function plot(a,k1,k2){if(!a.length)return '<p class="muted">Completa una missione per visualizzare il grafico.</p>';let x=i=>38+i*320/Math.max(1,a.length-1),y=n=>150-Math.max(0,Math.min(10,Number(n)))*12;return `<svg class="chart" viewBox="0 0 380 180" role="img" aria-label="Grafico delle autovalutazioni">${[0,2,4,6,8,10].map(n=>`<line x1="38" x2="358" y1="${y(n)}" y2="${y(n)}" stroke="#34435c"/><text x="8" y="${y(n)+4}" fill="#b7c4d8" font-size="11">${n}</text>`).join('')}${[k1,k2].map((k,j)=>`<polyline fill="none" stroke="${j?'#fbbf24':'#a5b4fc'}" stroke-width="2.5" points="${a.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>${a.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[k])}" r="3.5" fill="${j?'#fbbf24':'#a5b4fc'}"><title>Missione ${i+1}: ${Number(r[k])}/10</title></circle>`).join('')}`).join('')}<text x="38" y="173" fill="#b7c4d8" font-size="11">1</text><text x="358" y="173" text-anchor="end" fill="#b7c4d8" font-size="11">${a.length}</text></svg>`}
let chartMode='days';function chooseChart(m){chartMode=m;render()}
function dashboard(){let d=state.days.length,c=state.calls.length,dates=new Set([...state.days,...state.calls].map(r=>r.date).filter(Boolean)),today=new Date(),streak=0;if(!dates.has(localDay()))today.setDate(today.getDate()-1);while(dates.has([today.getFullYear(),String(today.getMonth()+1).padStart(2,'0'),String(today.getDate()).padStart(2,'0')].join('-'))){streak++;today.setDate(today.getDate()-1)}let goals=state.days.filter(r=>r.goal).length+state.calls.filter(r=>r.goal||r.xp===200).length;return `<section class="hero"><small>IL TUO PERCORSO</small><h2>${d<30?'Missione '+(d+1)+' · '+levels[Math.floor(d/5)]:'Percorso completato'}</h2><p>${d<30?tasks[d]:'Continua a esercitarti senza pressione.'}</p><div class="actions"><button onclick="switchTab('Allenamento')">Continua allenamento</button><button class="secondary" onclick="switchTab('Chiamate')">Sfida telefonica</button></div></section><div class="tiles">${[['Giorni consecutivi',streak,'Giorni con attività registrata'],['Obiettivi comunicativi',goals,'Messaggi comunicati'],['Sforzo medio',avg(state.days,'eff'),'Scala 0–10'],['Ansia dopo le chiamate',avg(state.calls,'after'),'Scala 0–10']].map(t=>`<div class="tile"><small>${t[0]}</small><strong>${t[1]}</strong><small>${t[2]}</small></div>`).join('')}</div><section><h2>Andamento dei progressi</h2><button class="${chartMode==='days'?'':'secondary'}" onclick="chooseChart('days')">Allenamenti</button><button class="${chartMode==='calls'?'':'secondary'}" onclick="chooseChart('calls')">Telefonate</button><div class="legend"><span>● ${chartMode==='days'?'Sforzo':'Ansia prima'}</span><span>● ${chartMode==='days'?'Paura':'Ansia dopo'}</span></div>${chartMode==='days'?plot(state.days,'eff','fear'):plot(state.calls,'before','after')}<small class="muted">Autovalutazioni, non misurazioni cliniche. Le oscillazioni sono normali.</small></section><section><h2>Mappa dei livelli</h2>${levels.map((l,i)=>{let n=Math.max(0,Math.min(5,d-i*5));return `<div class="levelrow"><small>${i+1}. ${l} · ${n}/5 ${n===5?'✓':''}</small><div class="bar"><i style="width:${n*20}%"></i></div></div>`}).join('')}</section><section><h2>Trofei e bonus</h2>${[[d>=1,'Primo passo'],[d>=5,'Primo livello'],[c>=1,'Prima telefonata'],[c>=5,'Cinque telefonate'],[state.bonus.length>=3,'Tre bonus'],[d>=30,'Percorso completato']].map(t=>`<p class="${t[0]?'earned':'locked'}">${t[0]?'🏆':'🔒'} ${t[1]}</p>`).join('')}<button onclick="switchTab('Allenamento')">Vai al bonus giornaliero</button></section>${voiceDashboard()}<section><h2>Backup</h2><button onclick="exportData()">Esporta progressi</button><label>Importa backup<input type="file" accept="application/json" onchange="importData(this)"></label></section>`}

let activeVoice=false, stream=null, ctx=null, recorder=null, frameTimer=null, frames=[], started=0, audioURL=null, lastVoice=null, chunks=[];

state.voice=Array.isArray(state.voice)?state.voice.filter(validVoice):[];
const prompts=['Buongiorno, il prezzo è di undici euro.','Presentati con nome e cognome.','Il totale è di otto euro e novanta centesimi.','Racconta la tua giornata per un minuto.','Spiega un prodotto a un cliente.','Simula una telefonata a un fornitore.'];
function voiceView(){return `<section class="hero"><small>DEEP VOICE · ANALISI LOCALE</small><h2>Laboratorio vocale</h2><p>Registra fino a 120 secondi. L’audio resta nella memoria del dispositivo e non viene inviato a un server.</p><select id="vp">${prompts.map(x=>`<option>${x}</option>`).join('')}</select><canvas id="wave" width="640" height="100" style="width:100%;background:#101827;border-radius:12px;margin-top:12px"></canvas><p id="vs" role="status">Pronto per registrare.</p><button id="startV" onclick="startVoice()">● Registra</button><button id="endV" disabled onclick="endVoice()">■ Termina</button><audio id="playV" controls hidden style="width:100%"></audio><div id="metrics"></div></section><section><h2>Autovalutazione e correzioni</h2><label>Trascrizione facoltativa (scrivila come hai parlato, anche con ripetizioni)<textarea id="vt" rows="3"></textarea></label>${range('vten','Tensione percepita')}<label>Parola o situazione difficile<textarea id="hard" rows="2" placeholder="Es. undici euro"></textarea></label><label><input type="checkbox" id="blockV"> Ho percepito un blocco</label><button onclick="reviewVoice()">Analizza e salva</button><div id="vr" aria-live="polite"></div><button class="secondary" onclick="shareVoice()">Copia report per ChatGPT</button><button class="secondary" onclick="downloadVoice()">Salva registrazione audio</button></section>${voiceDashboard()}`}
function releaseAudio(){if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;lastVoice=null}
async function startVoice(){if(activeVoice)return;releaseAudio();if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('vs').textContent='Microfono non disponibile: apri il sito tramite HTTPS in Safari o Chrome.';return}activeVoice=true;$('startV').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);let buf=new Float32Array(an.fftSize);frames=[];chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=finishAudio;recorder.start();started=performance.now();$('endV').disabled=false;$('playV').hidden=true;$('metrics').innerHTML='';$('vr').innerHTML='';frameTimer=setInterval(()=>{let t=(performance.now()-started)/1000;an.getFloatTimeDomainData(buf);let rms=Math.sqrt(buf.reduce((s,x)=>s+x*x,0)/buf.length);frames.push({t,rms});let c=$('wave').getContext('2d');c.fillStyle='#101827';c.fillRect(0,0,640,100);c.strokeStyle='#a5b4fc';c.beginPath();buf.forEach((x,i)=>{let px=i*640/buf.length,py=50+x*48;i?c.lineTo(px,py):c.moveTo(px,py)});c.stroke();$('vs').textContent='Registrazione · '+Math.floor(t)+' s';if(t>=120)endVoice()},50)}catch(e){cleanupVoice();activeVoice=false;$('startV').disabled=false;$('vs').textContent='Impossibile registrare: verifica autorizzazioni e HTTPS.'}}
function cleanupVoice(){clearInterval(frameTimer);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close().catch(()=>{});stream=null;ctx=null}
function endVoice(){if(recorder?.state==='recording'){clearInterval(frameTimer);$('endV').disabled=true;recorder.stop()}}
function measure(f,duration){let sorted=f.map(x=>x.rms).sort((a,b)=>a-b),floor=sorted[Math.floor(sorted.length*.15)]||0,peak=sorted[Math.floor(sorted.length*.95)]||0,threshold=Math.max(.004,Math.min(floor*3,peak*.25));let voiced=f.filter(x=>x.rms>threshold),pauses=[];if(voiced.length){let start=null;for(let x of f){if(x.t<voiced[0].t||x.t>voiced.at(-1).t)continue;if(x.rms<=threshold){if(start===null)start=x.t}else if(start!==null){if(x.t-start>=.65)pauses.push({start,seconds:x.t-start});start=null}}}return {duration,pauseCount:pauses.length,pauseSeconds:pauses.reduce((s,x)=>s+x.seconds,0),pauses,signal:peak>.008&&voiced.length>5}}
function finishAudio(){let duration=(performance.now()-started)/1000;let blob=new Blob(chunks,{type:recorder.mimeType||chunks[0]?.type});cleanupVoice();activeVoice=false;audioURL=URL.createObjectURL(blob);$('playV').src=audioURL;$('playV').hidden=false;$('startV').disabled=false;lastVoice={...measure(frames,duration),prompt:$('vp').value};$('vs').textContent='Registrazione terminata. Riascolta e completa la valutazione.';$('metrics').innerHTML=`<div class="tiles"><div class="tile">Durata<strong>${duration.toFixed(1)} s</strong></div><div class="tile">Pause acustiche stimate<strong>${lastVoice.signal?lastVoice.pauseCount:'—'}</strong></div></div><p class="muted">${lastVoice.signal?'Intervalli di bassa energia ≥ 0,65 s; non equivalgono a blocchi.':'Segnale insufficiente per stimare le pause.'}</p>${lastVoice.signal?lastVoice.pauses.map(x=>`<button class="secondary" onclick="seekVoice(${x.start})">Riascolta ${x.start.toFixed(1)} s (${x.seconds.toFixed(1)} s)</button>`).join(''):''}`}
function seekVoice(t){$('playV').currentTime=Math.max(0,t-1);$('playV').play().catch(()=>{})}
function reviewVoice(){if(!lastVoice||activeVoice){$('vr').textContent='Registra prima un esercizio.';return}let text=$('vt').value.trim(),words=text.match(/[\p{L}\p{N}]+/gu)||[],repeats=words.filter((w,i)=>i&&w.toLowerCase()===words[i-1].toLowerCase()).length,tension=val('vten'),hard=$('hard').value.trim(),block=$('blockV').checked;let r={...lastVoice,words:words.length,repeats,tension,hard,block,date:localDay(),wpm:words.length?Math.round(words.length*60/lastVoice.duration):null};let advice=tension>=7?'Riduci lo sforzo: scegli una frase breve, lascia andare la tensione e riprova senza spingere.':block?'Quando percepisci un blocco, concediti tempo e riprendi senza forzare.':'Mantieni un ritmo naturale, concentrandoti sul messaggio.';if(hard)advice+=' Esercizio: usa «'+hard+'» in tre frasi diverse, senza obbligarti a essere fluente.';r.advice=advice;lastVoice.report=r;if(!lastVoice.saved){state.voice.push(r);lastVoice.saved=true}else state.voice[state.voice.length-1]=r;save();$('vr').innerHTML=`<h3>Feedback orientativo</h3><p>Ritmo stimato: ${r.wpm===null?'trascrizione necessaria':r.wpm+' parole/min (pause incluse)'}. Ripetizioni consecutive nel testo: ${words.length?repeats:'non valutabili'}.</p><p>${esc(advice)}</p><p class="muted">Pause, ripetizioni e ritmo non sono una diagnosi. Non possiamo identificare con certezza la parola associata a una pausa.</p><p>Sessione salvata nella dashboard.</p>`}
async function shareVoice(){let r=lastVoice?.report;if(!r){$('vr').textContent='Completa prima l’analisi.';return}let text='Speak Quest – aiutami a interpretare questo report non clinico e proponi un esercizio: '+JSON.stringify(r);try{await navigator.clipboard.writeText(text);alert('Report copiato: incollalo in ChatGPT.')}catch(e){let a=document.createElement('textarea');a.value=text;$('vr').append(a);a.select()}}
function downloadVoice(){if(!audioURL)return;let a=document.createElement('a');a.href=audioURL;a.download='speakquest-voce.'+(recorder.mimeType.includes('mp4')?'m4a':recorder.mimeType.includes('ogg')?'ogg':'webm');a.click()}
function voiceDashboard(){let a=state.voice||[];return `<section><h2>Progressi vocali</h2><div class="tiles"><div class="tile">Sessioni<strong>${a.length}</strong></div><div class="tile">Tensione media<strong>${avg(a,'tension')}</strong></div></div>${a.length?plot(a,'tension','tension'):'<p class="muted">Registra il primo esercizio per iniziare.</p>'}<p class="muted">Grafico: tensione percepita (0–10). Le pause dipendono anche dal testo e dal rumore.</p>${a.slice(-5).reverse().map(r=>`<p>${esc(r.date||'')} · ${esc(r.prompt)}<br><small>${r.duration.toFixed(1)} s · pause stimate: ${r.signal?r.pauseCount:'—'} · tensione ${r.tension}/10</small></p>`).join('')}<button onclick="switchTab('Voce')">Apri laboratorio vocale</button></section>`}

render();</script></html>
