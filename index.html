let state={days:[],calls:[],bonus:[]};try{state=JSON.parse(localStorage.getItem('speakquest5'))||state}catch(e){}let tab='Dashboard',step=Math.max(0,Math.min(4,Number(state.resumeStep)||0)),opened=false,recognition=null,clock=null;const $=id=>document.getElementById(id);function save(){state.resumeStep=step;try{localStorage.setItem('speakquest5',JSON.stringify(state))}catch(e){alert('Salvataggio locale non disponibile. Usa Esporta.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function range(id,label){return `<label>${label}: <output id="${id}o">5</output>/10<input id="${id}" type="range" min="0" max="10" value="5" oninput="document.getElementById('${id}o').value=this.value"></label>`}function val(id){return Number($(id).value)}function switchTab(t){if(activeVoice){alert("Termina prima la registrazione.");return}releaseAudio();stop();tab=t;render();window.scrollTo({top:0,behavior:"instant"})}function stop(){if(clock)clearInterval(clock);clock=null;if(recognition){try{recognition.stop()}catch(e){}recognition=null}}function render(){if(!state.profile){showQuiz();return}let d=state.days.length,c=state.calls.length,xp=d*100+state.calls.reduce((a,b)=>a+b.xp,0)+state.bonus.length*50;$('header').innerHTML=`<div class="score">${xp} XP · Livello ${Math.min(6,1+Math.floor(d/5))}</div><p>${d}/30 giorni · ${c}/12 chiamate</p><progress max="30" value="${d}"></progress>`;$('nav').innerHTML=['Dashboard','Allenamento','Voce','Chiamate','Statistiche'].map(t=>`<button class="${tab===t?'active':'secondary'}" aria-current="${tab===t?'page':'false'}" onclick="switchTab('${t}')"><b aria-hidden="true">${({Dashboard:'⌂',Allenamento:'◎',Voce:'◉',Chiamate:'☎',Statistiche:'▥'})[t]}</b>${t==='Dashboard'?'Home':t==='Allenamento'?'Missioni':t}</button>`).join('');let v=$('view');if(tab==='Dashboard'){v.innerHTML=`<div class="quick"><button onclick="switchTab('Allenamento')">${d<30?'▶ Continua allenamento · Giorno '+(d+1):'Percorso completato'}<small>La tua missione quotidiana</small></button><button class="secondary" onclick="switchTab('Voce')">◉ Registra voce<small>Analisi e riascolto</small></button><button class="secondary" onclick="switchTab('Chiamate')">☎ Sfida reale<small>Telefonate guidate</small></button></div>`+profileCard()+dashboard();}else if(tab==='Allenamento'){if(d>=30){v.innerHTML='<section><h2>Percorso completato!</h2>Continua a praticare senza pressione.</section>';return}let phases=['Riscaldamento','Tecnica vocale','Missione','Discorso libero','Autovalutazione'],instructions=['Rilassa spalle e mandibola. Respira naturalmente.',personalTechnique(),personalTask(d),'Parla liberamente di lavoro, sport, viaggi o futuro. Non ricominciare per ogni esitazione.'];v.innerHTML=`<section><small>GIORNO ${d+1} · ${levels[Math.floor(d/5)]}</small><h2>${phases[step]} (${step+1}/5)</h2><div class="phasebar">${phases.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${step<4?`<p>${instructions[step]}</p><p id="timer" aria-live="off">${phaseMinutes()[step]}:00</p><button onclick="timer(${phaseMinutes()[step]}*60)">Avvia timer</button><button class="secondary" onclick="stop()">Ferma timer</button><button onclick="stop();step++;save();render()">Continua</button>${step>0?`<button class="secondary" onclick="stop();step--;save();render()">Indietro</button>`:''}`:range('eff','Sforzo')+range('fear','Paura')+'<label><input type="checkbox" id="goal"> Ho comunicato ciò che volevo</label><button onclick="finishDay()">Completa +100 XP</button>'}</section><section><h2>Bonus +50 XP</h2>${state.bonus.includes(d)?'Bonus completato':opened?`<p>${['Presentati con nome e cognome.','Pronuncia tre prezzi in frasi.','Spiega un prodotto in un minuto.','Racconta un progetto futuro.'][d%4]}</p><button onclick="state.bonus.push(${d});save();render()">Sfida affrontata</button>`:'<button onclick="opened=true;render()">Apri bonus misterioso</button>'}</section>`}else if(tab==='Voce'){v.innerHT h>30||x.calls.length>12||!x.days.every(r=>Number.isFinite(r.eff)&&Number.isFinite(r.fear))||!x.calls.every(r=>Number.isFinite(r.before)&&Number.isFinite(r.after)&&Number.isFinite(r.xp)))throw Error();state=x;state.voice=Array.isArray(x.voice)?x.voice.filter(validVoice):[];step=0;save();render()}catch(e){alert('Backup non valido')}}
function localDay(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function plot(a,k1,k2){if(!a.length)return '<p class="muted">Completa una missione per visualizzare il grafico.</p>';let x=i=>38+i*320/Math.max(1,a.length-1),y=n=>150-Math.max(0,Math.min(10,Number(n)))*12;return `<svg class="chart" viewBox="0 0 380 180" role="img" aria-label="Grafico delle autovalutazioni">${[0,2,4,6,8,10].map(n=>`<line x1="38" x2="358" y1="${y(n)}" y2="${y(n)}" stroke="#34435c"/><text x="8" y="${y(n)+4}" fill="#b7c4d8" font-size="11">${n}</text>`).join('')}${[k1,k2].map((k,j)=>`<polyline fill="none" stroke="${j?'#fbbf24':'#a5b4fc'}" stroke-width="2.5" points="${a.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>${a.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[k])}" r="3.5" fill="${j?'#fbbf24':'#a5b4fc'}"><title>Missione ${i+1}: ${Number(r[k])}/10</title></circle>`).join('')}`).join('')}<text x="38" y="173" fill="#b7c4d8" font-size="11">1</text><text x="358" y="173" text-anchor="end" fill="#b7c4d8" font-size="11">${a.length}</text></svg>`}
