let state={days:[],calls:[],bonus:[]};try{state=JSON.parse(localStorage.getItem('speakquest5'))||state}catch(e){}let tab='Dashboard',step=Math.max(0,Math.min(4,Number(state.resumeStep)||0)),opened=false,recognition=null,clock=null;const $=id=>document.getElementById(id);function save(){state.resumeStep=step;try{localStorage.setItem('speakquest5',JSON.stringify(state))}catch(e){alert('Salvataggio locale non disponibile. Usa Esporta.')}}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function range(id,label){return `<label>${label}: <output id="${id}o">5</output>/10<input id="${id}" type="range" min="0" max="10" value="5" oninput="document.getElementById('${id}o').value=this.value"></label>`}function val(id){return Number($(id).value)}function switchTab(t){if(activeVoice){alert("Termina prima la registrazione.");return}releaseAudio();stop();tab=t;render();window.scrollTo({top:0,behavior:"instant"})}function stop(){if(clock)clearInterval(clock);clock=null;if(recognition){try{recognition.stop()}catch(e){}recognition=null}}function render(){if(!state.profile){showQuiz();return}let d=state.days.length,c=state.calls.length,xp=d*100+state.calls.reduce((a,b)=>a+b.xp,0)+state.bonus.length*50;$('header').innerHTML=`<div class="score">${xp} XP · Livello ${Math.min(6,1+Math.floor(d/5))}</div><p>${d}/30 giorni · ${c}/12 chiamate</p><progress max="30" value="${d}"></progress>`;$('nav').innerHTML=['Dashboard','Allenamento','Voce','Chiamate','Statistiche'].map(t=>`<button class="${tab===t?'active':'secondary'}" aria-current="${tab===t?'page':'false'}" onclick="switchTab('${t}')"><b aria-hidden="true">${({Dashboard:'⌂',Allenamento:'◎',Voce:'◉',Chiamate:'☎',Statistiche:'▥'})[t]}</b>${t==='Dashboard'?'Home':t==='Allenamento'?'Missioni':t}</button>`).join('');let v=$('view');if(tab==='Dashboard'){v.innerHTML=`<div class="quick"><button onclick="switchTab('Allenamento')">${d<30?'▶ Continua allenamento · Giorno '+(d+1):'Percorso completato'}<small>La tua missione quotidiana</small></button><button class="secondary" onclick="switchTab('Voce')">◉ Registra voce<small>Analisi e riascolto</small></button><button class="secondary" onclick="switchTab('Chiamate')">☎ Sfida reale<small>Telefonate guidate</small></button></div>`+profileCard()+dashboard();}else if(tab==='Allenamento'){if(d>=30){v.innerHTML='<section><h2>Percorso completato!</h2>Continua a praticare senza pressione.</section>';return}let phases=['Riscaldamento','Tecnica vocale','Missione','Discorso libero','Autovalutazione'],instructions=['Rilassa spalle e mandibola. Respira naturalmente.',personalTechnique(),personalTask(d),'Parla liberamente di lavoro, sport, viaggi o futuro. Non ricominciare per ogni esitazione.'];v.innerHTML=`<section><small>GIORNO ${d+1} · ${levels[Math.floor(d/5)]}</small><h2>${phases[step]} (${step+1}/5)</h2><div class="phasebar">${phases.map((_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>${step<4?`<p>${instructions[step]}</p><p id="timer" aria-live="off">${phaseMinutes()[step]}:00</p><button onclick="timer(${phaseMinutes()[step]}*60)">Avvia timer</button><button class="secondary" onclick="stop()">Ferma timer</button><button onclick="stop();step++;save();render()">Continua</button>${step>0?`<button class="secondary" onclick="stop();step--;save();render()">Indietro</button>`:''}`:range('eff','Sforzo')+range('fear','Paura')+'<label><input type="checkbox" id="goal"> Ho comunicato ciò che volevo</label><button onclick="finishDay()">Completa +100 XP</button>'}</section><section><h2>Bonus +50 XP</h2>${state.bonus.includes(d)?'Bonus completato':opened?`<p>${['Presentati con nome e cognome.','Pronuncia tre prezzi in frasi.','Spiega un prodotto in un minuto.','Racconta un progetto futuro.'][d%4]}</p><button onclick="state.bonus.push(${d});save();render()">Sfida affrontata</button>`:'<button onclick="opened=true;render()">Apri bonus misterioso</button>'}</section>`}else if(tab==='Voce'){v.innerHT h>30||x.calls.length>12||!x.days.every(r=>Number.isFinite(r.eff)&&Number.isFinite(r.fear))||!x.calls.every(r=>Number.isFinite(r.before)&&Number.isFinite(r.after)&&Number.isFinite(r.xp)))throw Error();state=x;state.voice=Array.isArray(x.voice)?x.voice.filter(validVoice):[];step=0;save();render()}catch(e){alert('Backup non valido')}}
function localDay(){let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

function plot(a,k1,k2){if(!a.length)return '<p class="muted">Completa una missione per visualizzare il grafico.</p>';let x=i=>38+i*320/Math.max(1,a.length-1),y=n=>150-Math.max(0,Math.min(10,Number(n)))*12;return `<svg class="chart" viewBox="0 0 380 180" role="img" aria-label="Grafico delle autovalutazioni">${[0,2,4,6,8,10].map(n=>`<line x1="38" x2="358" y1="${y(n)}" y2="${y(n)}" stroke="#34435c"/><text x="8" y="${y(n)+4}" fill="#b7c4d8" font-size="11">${n}</text>`).join('')}${[k1,k2].map((k,j)=>`<polyline fill="none" stroke="${j?'#fbbf24':'#a5b4fc'}" stroke-width="2.5" points="${a.map((r,i)=>x(i)+','+y(r[k])).join(' ')}"/>${a.map((r,i)=>`<circle cx="${x(i)}" cy="${y(r[k])}" r="3.5" fill="${j?'#fbbf24':'#a5b4fc'}"><title>Missione ${i+1}: ${Number(r[k])}/10</title></circle>`).join('')}`).join('')}<text x="38" y="173" fill="#b7c4d8" font-size="11">1</text><text x="358" y="173" text-anchor="end" fill="#b7c4d8" font-size="11">${a.length}</text></svg>`}

function voiceView(){return `<section class="hero"><small>DEEP VOICE · ANALISI LOCALE</small><h2>Laboratorio vocale</h2><p>Registra fino a 120 secondi. L’audio resta nella memoria del dispositivo e non viene inviato a un server.</p><select id="vp">${prompts.map(x=>`<option>${x}</option>`).join('')}</select><canvas id="wave" width="640" height="100" style="width:100%;background:#101827;border-radius:12px;margin-top:12px"></canvas><p id="vs" role="status">Pronto per registrare.</p><button id="startV" onclick="startVoice()">● Registra</button><button id="endV" disabled onclick="endVoice()">■ Termina</button><audio id="playV" controls hidden style="width:100%"></audio><div id="metrics"></div></section><section><h2>Autovalutazione e correzioni</h2><label>Trascrizione facoltativa (scrivila come hai parlato, anche con ripetizioni)<textarea id="vt" rows="3"></textarea></label>${range('vten','Tensione percepita')}<label>Parola o situazione difficile<textarea id="hard" rows="2" placeholder="Es. undici euro"></textarea></label><label><input type="checkbox" id="blockV"> Ho percepito un blocco</label><button onclick="reviewVoice()">Analizza e salva</button><div id="vr" aria-live="polite"></div><button class="secondary" onclick="shareVoice()">Copia report per ChatGPT</button><button class="secondary" onclick="downloadVoice()">Salva registrazione audio</button></section>${voiceDashboard()}`}
function releaseAudio(){if(audioURL)URL.revokeObjectURL(audioURL);audioURL=null;lastVoice=null}
async function startVoice(){if(activeVoice)return;releaseAudio();if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){$('vs').textContent='Microfono non disponibile: apri il sito tramite HTTPS in Safari o Chrome.';return}activeVoice=true;$('startV').disabled=true;try{stream=await navigator.mediaDevices.getUserMedia({audio:true});ctx=new (window.AudioContext||window.webkitAudioContext)();await ctx.resume();let an=ctx.createAnalyser();an.fftSize=1024;ctx.createMediaStreamSource(stream).connect(an);let buf=new Float32Array(an.fftSize);frames=[];chunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};recorder.onstop=finishAudio;recorder.start();started=performance.now();$('endV').disabled=false;$('playV').hidden=true;$('metrics').innerHTML='';$('vr').innerHTML='';frameTimer=setInterval(()=>{let t=(performance.now()-started)/1000;an.getFloatTimeDomainData(buf);let rms=Math.sqrt(buf.reduce((s,x)=>s+x*x,0)/buf.length);frames.push({t,rms});let c=$('wave').getContext('2d');c.fillStyle='#101827';c.fillRect(0,0,640,100);c.strokeStyle='#a5b4fc';c.beginPath();buf.forEach((x,i)=>{let px=i*640/buf.length,py=50+x*48;i?c.lineTo(px,py):c.moveTo(px,py)});c.stroke();$('vs').textContent='Registrazione · '+Math.floor(t)+' s';if(t>=120)endVoice()},50)}catch(e){cleanupVoice();activeVoice=false;$('startV').disabled=false;$('vs').textContent='Impossibile registrare: verifica autorizzazioni e HTTPS.'}}
function cleanupVoice(){clearInterval(frameTimer);if(stream)stream.getTracks().forEach(t=>t.stop());if(ctx)ctx.close().catch(()=>{});stream=null;ctx=null}
function endVoice(){if(recorder?.state==='recording'){clearInterval(frameTimer);$('endV').disabled=true;recorder.stop()}}
function measure(f,duration){let sorted=f.map(x=>x.rms).sort((a,b)=>a-b),floor=sorted[Math.floor(sorted.length*.15)]||0,peak=sorted[Math.floor(sorted.length*.95)]||0,threshold=Math.max(.004,Math.min(floor*3,peak*.25));let voiced=f.filter(x=>x.rms>threshold),pauses=[];if(voiced.length){let start=null;for(let x of f){if(x.t<voiced[0].t||x.t>voiced.at(-1).t)continue;if(x.rms<=threshold){if(start===null)start=x.t}else if(start!==null){if(x.t-start>=.65)pauses.push({start,seconds:x.t-start});start=null}}}return {duration,pauseCount:pauses.length,pauseSeconds:pauses.reduce((s,x)=>s+x.seconds,0),pauses,signal:peak>.008&&voiced.length>5}}
function finishAudio(){let duration=(performance.now()-started)/1000;let blob=new Blob(chunks,{type:recorder.mimeType||chunks[0]?.type});cleanupVoice();activeVoice=false;audioURL=URL.createObjectURL(blob);$('playV').src=audioURL;$('playV').hidden=false;$('startV').disabled=false;lastVoice={...measure(frames,duration),prompt:$('vp').value};$('vs').textContent='Registrazione terminata. Riascolta e completa la valutazione.';$('metrics').innerHTML=`<div class="tiles"><div class="tile">Durata<strong>${duration.toFixed(1)} s</strong></div><div class="tile">Pause acustiche stimate<strong>${lastVoice.signal?lastVoice.pauseCount:'—'}</strong></div></div><p class="muted">${lastVoice.signal?'Intervalli di bassa energia ≥ 0,65 s; non equivalgono a blocchi.':'Segnale insufficiente per stimare le pause.'}</p>${lastVoice.signal?lastVoice.pauses.map(x=>`<button class="secondary" onclick="seekVoice(${x.start})">Riascolta ${x.start.toFixed(1)} s (${x.seconds.toFixed(1)} s)</button>`).join(''):''}`}
function seekVoice(t){$('playV').currentTime=Math.max(0,t-1);$('playV').play().catch(()=>{})}
function reviewVoice(){if(!lastVoice||activeVoice){$('vr').textContent='Registra prima un esercizio.';return}let text=$('vt').value.trim(),words=text.match(/[\p{L}\p{N}]+/gu)||[],repeats=words.filter((w,i)=>i&&w.toLowerCase()===words[i-1].toLowerCase()).length,tension=val('vten'),hard=$('hard').value.trim(),block=$('blockV').checked;let r={...lastVoice,words:words.length,repeats,tension,hard,block,date:localDay(),wpm:words.length?Math.round(words.length*60/lastVoice.duration):null};let advice=tension>=7?'Riduci lo sforzo: scegli una frase breve, lascia andare la tensione e riprova senza spingere.':block?'Quando percepisci un blocco, concediti tempo e riprendi senza forzare.':'Mantieni un ritmo naturale, concentrandoti sul messaggio.';if(hard)advice+=' Esercizio: usa «'+hard+'» in tre frasi diverse, senza obbligarti a essere fluente.';r.advice=advice;lastVoice.report=r;if(!lastVoice.saved){state.voice.push(r);lastVoice.saved=true}else state.voice[state.voice.length-1]=r;save();$('vr').innerHTML=`<h3>Feedback orientativo</h3><p>Ritmo stimato: ${r.wpm===null?'trascrizione necessaria':r.wpm+' parole/min (pause incluse)'}. Ripetizioni consecutive nel testo: ${words.length?repeats:'non valutabili'}.</p><p>${esc(advice)}</p><p class="muted">Pause, ripetizioni e ritmo non sono una diagnosi. Non possiamo identificare con certezza la parola associata a una pausa.</p><p>Sessione salvata nella dashboard.</p>`}
async function shareVoice(){let r=lastVoice?.report;if(!r){$('vr').textContent='Completa prima l’analisi.';return}let text='Speak Quest – aiutami a interpretare questo report non clinico e proponi un esercizio: '+JSON.stringify(r);try{await navigator.clipboard.writeText(text);alert('Report copiato: incollalo in ChatGPT.')}catch(e){let a=document.createElement('textarea');a.value=text;$('vr').append(a);a.select()}}
function downloadVoice(){if(!audioURL)return;let a=document.createElement('a');a.href=audioURL;a.download='speakquest-voce.'+(recorder.mimeType.includes('mp4')?'m4a':recorder.mimeType.includes('ogg')?'ogg':'webm');a.click()}
function voiceDashboard(){let a=state.voice||[];return `<section><h2>Progressi vocali</h2><div class="tiles"><div class="tile">Sessioni<strong>${a.length}</strong></div><div class="tile">Tensione media<strong>${avg(a,'tension')}</strong></div></div>${a.length?plot(a,'tension','tension'):'<p class="muted">Registra il primo esercizio per iniziare.</p>'}<p class="muted">Grafico: tensione percepita (0–10). Le pause dipendono anche dal testo e dal rumore.</p>${a.slice(-5).reverse().map(r=>`<p>${esc(r.date||'')} · ${esc(r.prompt)}<br><small>${r.duration.toFixed(1)} s · pause stimate: ${r.signal?r.pauseCount:'—'} · tensione ${r.tension}/10</small></p>`).join('')}<button onclick="switchTab('Voce')">Apri laboratorio vocale</button></section>`}


const areas=['Presentazioni e nome','Numeri e prezzi','Telefonate','Conversazioni con sconosciuti','Lavoro o studio','Parole evitate'];
const questions=[...areas.map(a=>({label:'Quanto ti mette in difficoltà: '+a,opts:['Per niente','Poco','Abbastanza','Molto','Moltissimo']})),{label:'Quanto spesso eviti di parlare o cambi parole?',opts:['Mai','Raramente','A volte','Spesso','Quasi sempre']},{label:'Come parli quando sei da solo?',opts:['Fluente','Qualche esitazione','Blocchi frequenti']},{label:'Hai già seguito un percorso di logopedia?',opts:['No','Sì, in passato','Sì, attualmente']},{label:'Quanto tempo vuoi dedicare al giorno?',opts:['5 minuti','10 minuti','15 minuti','20 minuti']}];
let qi=0,answers=[];
function showQuiz(){ $('header').innerHTML='<small>VALUTAZIONE INIZIALE · '+(qi+1)+'/'+questions.length+'</small><progress max="'+questions.length+'" value="'+qi+'"></progress>'; $('nav').innerHTML='';let q=questions[qi];$('view').innerHTML='<section class="hero"><small>IL TUO PROFILO</small><h2>'+q.label+'</h2><p>Non ci sono risposte giuste o sbagliate. Le risposte restano su questo dispositivo.</p>'+q.opts.map((o,i)=>'<button style="display:block;width:100%;text-align:left" class="'+(answers[qi]===i?'':'secondary')+'" onclick="answerQuiz('+i+')">'+o+'</button>').join('')+(qi?'<button class="secondary" onclick="qi--;showQuiz()">Indietro</button>':'')+'</section>';}
function answerQuiz(i){answers[qi]=i;if(qi<questions.length-1){qi++;showQuiz();return}state.profile={answers:answers.slice(),minutes:[5,10,15,20][answers[9]]};save();render()}
function priorities(){let a=state.profile?.answers||[];return areas.map((_,i)=>i).sort((i,j)=>(a[j]||0)-(a[i]||0));}
function focusFor(d){let p=priorities();return d%5===4?p[2]:d%3===2?p[1]:p[0]}
const drills=[['Presentati ad alta voce con nome e cognome.','Simula una presentazione a una persona nuova.','Presentati in una situazione reale scelta da te.'],['Leggi cinque prezzi e numeri in frasi complete.','Simula una vendita o una richiesta di prezzo.','Comunica un prezzo o un numero in una situazione autentica.'],['Leggi un breve copione telefonico.','Registra una simulazione di telefonata.','Fai una chiamata autentica, se te la senti.'],['Descrivi un oggetto a un interlocutore immaginario.','Simula una richiesta di informazioni.','Chiedi una informazione a una persona nuova.'],['Spiega un argomento del tuo lavoro o studio.','Simula una domanda imprevista di un collega.','Esprimi una richiesta reale al lavoro o a scuola.'],['Scegli tre parole che tendi a evitare e inseriscile in frasi.','Usa le parole scelte in una conversazione simulata.','Prova a usare una parola evitata in una situazione reale gestibile.']];
function personalTask(d){let f=focusFor(d),recent=state.days.slice(-2),hard=recent.some(r=>r.fear>=8||r.eff>=8),stage=Math.max(0,Math.min(2,Math.floor(d/10)-(hard?1:0)));return drills[f][stage]+(hard?' Oggi riduci la difficoltà se necessario, senza forzarti.':'')}
function personalTechnique(){return 'Esercitati con calma, senza forzare la voce. Tema: '+areas[focusFor(state.days.length)]+'. Puoi fare pause e continuare anche se balbetti.'}
function phaseMinutes(){return ({5:[1,1,2,1],10:[2,2,4,2],15:[3,4,5,3],20:[4,5,7,4]})[state.profile?.minutes]||[3,4,5,3]}
function profileCard(){return '<section><small>PIANO PERSONALIZZATO</small><h2>Le tue priorità</h2>'+priorities().slice(0,3).map(i=>'<p>• '+areas[i]+'</p>').join('')+'<p>'+state.profile.minutes+' minuti al giorno · difficoltà adattata alle ultime autovalutazioni.</p><button class="secondary" onclick="qi=0;answers=state.profile.answers.slice();showQuiz()">Aggiorna valutazione</button><p class="muted">Profilo locale: salvataggio automatico su questo browser. Per cambiare dispositivo esporta e importa il backup. Nessun account cloud attivo.</p></section>'}

(()=>{let enabled=false,closed=false,started=Date.now(),index=-1,interval,audio,osc=[];const intro=document.getElementById('comicIntro'),caption=document.getElementById('comicCaption'),art=document.getElementById('comicArt');const scenes=[['Ti è mai capitato di sapere cosa dire, ma di non riuscire a pronunciarlo?',0],['Di avere paura di rispondere al telefono?',1],['O di bloccarti mentre dici il tuo nome?',2],['La tua voce merita spazio. Inizia il tuo percorso. Benvenuto in Speak Quest.',3]];const times=[0,8,13,18];function speak(t){if(!enabled||!window.speechSynthesis)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='it-IT';u.rate=.94;let v=speechSynthesis.getVoices().find(v=>v.lang==='it-IT');if(v)u.voice=v;speechSynthesis.speak(u)}catch(e){}}function music(){try{audio=new (window.AudioContext||window.webkitAudioContext)();audio.resume();let gain=audio.createGain();gain.gain.value=.018;gain.connect(audio.destination);[110,164.81,220].forEach(f=>{let o=audio.createOscillator();o.type='sine';o.frequency.value=f;o.connect(gain);o.start();osc.push(o)})}catch(e){}}function person(x,y,shirt){return `<g transform="translate(${x} ${y})" stroke="#142421" stroke-width="4"><path d="M-42 105 Q-40 45 0 45 Q40 45 42 105" fill="${shirt}"/><circle cy="10" r="32" fill="#e9b88c"/><path d="M-31 5 Q-40 -35 0 -28 Q36 -30 32 4 Q5 -12 -31 5" fill="#263833"/><path d="M-13 12h3m20 0h3M-8 29q8 -5 16 0" fill="none" stroke-linecap="round"/></g>`}function draw(i){let content=i===0?person(100,100,'#7bb59b')+person(235,110,'#e2b45f')+'<path d="M35 20H180V72H120L95 90V72H35Z" fill="#fff4dc" stroke="#142421" stroke-width="4"/><text x="108" y="53" text-anchor="middle" font-size="24">…</text>':i===1?person(100,100,'#7bb59b')+'<g transform="rotate(12 245 105)"><rect x="205" y="40" width="80" height="145" rx="12" fill="#182b25" stroke="#101916" stroke-width="4"/><rect x="213" y="52" width="64" height="112" rx="6" fill="#a8e3b1"/><text x="245" y="110" text-anchor="middle" font-size="28">☎</text></g><text x="240" y="30" font-size="18" font-weight="900">DRIN!</text>':i===2?person(110,105,'#7bb59b')+person(260,115,'#e2b45f')+'<path d="M30 18H220V75H130L105 94V75H30Z" fill="#fff4dc" stroke="#142421" stroke-width="4"/><text x="125" y="52" text-anchor="middle" font-size="19">Mi chiamo…</text>':'<g fill="#d7f8d3" text-anchor="middle" font-weight="900"><text x="180" y="95" font-size="53" stroke="#29443a" stroke-width="2">SPEAK</text><text x="180" y="151" font-size="53" stroke="#29443a" stroke-width="2">QUEST</text><text x="180" y="185" font-size="12">LA TUA VOCE. IL TUO PERCORSO.</text></g>';art.innerHTML=`<svg class="panel" viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.4" fill="#152d28" opacity=".25"/></pattern></defs><rect x="3" y="3" width="354" height="234" rx="12" fill="${i===3?'#203b32':'#a8c5ae'}" stroke="#e9eddb" stroke-width="6"/><rect x="8" y="8" width="344" height="224" fill="url(#dots)"/>${content}</svg>`}function tick(){let t=(Date.now()-started)/1000;document.getElementById('comicProgress').value=t;if(t>=25)return close();let i=times.reduce((a,v,j)=>t>=v?j:a,0);if(i!==index){index=i;caption.textContent=scenes[i][0];draw(i);speak(scenes[i][0])}}function close(){if(closed)return;closed=true;clearInterval(interval);try{window.speechSynthesis?.cancel();osc.forEach(o=>o.stop());audio?.close()}catch(e){}intro.remove()}document.getElementById('comicSound').onclick=e=>{e.stopPropagation();if(enabled)return;enabled=true;document.getElementById('coachMute').textContent='Voce: ON';e.target.hidden=true;started=Date.now();index=-1;music();tick()};intro.onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});interval=setInterval(tick,150);tick();const read=()=>{let v=document.getElementById('view');let h=v?.querySelector('h2');let p=v?.querySelector('p');if(h)speak(h.textContent+'. '+(p?.textContent||''))};document.getElementById('coachRead').onclick=()=>{enabled=true;document.getElementById('coachMute').textContent='Voce: ON';read()};document.getElementById('coachMute').onclick=e=>{enabled=!enabled;e.target.textContent='Voce: '+(enabled?'ON':'OFF');if(enabled)read();else window.speechSynthesis?.cancel()};let last='';new MutationObserver(()=>{if(!closed||!enabled)return;let h=document.querySelector('#view h2')?.textContent||'';if(h&&h!==last){last=h;read()}}).observe(document.getElementById('view'),{childList:true,subtree:true});})();</script></html>
